objective:

  requested_outcome: >
    Design a bounded quantitative methodology that determines whether Expected
    Shortfall / CVaR provides useful tail-risk information beyond VaR for a trading
    strategy whose returns may be fat-tailed and regime-dependent. The methodology
    MUST compare VaR and Expected Shortfall, MUST NOT assume normal returns, MUST state
    assumptions and sign conventions, MUST include fat-tail and regime-dependent
    analysis, MUST define evidence that would support using both metrics, MUST define
    evidence that would weaken or reject that conclusion, and MUST state important
    limitations. Research methodology only.

  reason: >
    Certify that the Pi runtime can execute the canonical GQE research stage with
    governance-loaded authority, produce a structured terminal result, and hand a
    hash-bound artifact to an independent validator.

  definition_of_completion:
    - "A structured research result is returned with status COMPLETED | BLOCKED | INCONCLUSIVE."
    - "The methodology compares VaR and Expected Shortfall without a normality assumption."
    - "Sign conventions, assumptions, units and confidence-level semantics are stated explicitly."
    - "Fat-tail and regime-dependence treatment is defined."
    - "Supporting evidence criteria and refuting evidence criteria are both defined."
    - "Limitations, unresolved risks and required human decisions are listed."
    - "A handoff status and next recommended specialist are declared."

  intended_downstream_consumer: "quant-validator"

scope:

  in_scope:
    - "Quantitative research methodology specification (mathematical, statistical, evaluative)."
    - "VaR and Expected Shortfall definitions, estimators, and comparison design."
    - "Fat-tail representations, regime definitions, and estimator-error treatment."
    - "Evidence criteria for and against using both metrics."
    - "Research oracles and expected numerical behavior."

  out_of_scope:
    - "Production implementation of any kind."
    - "Data ingestion, timestamp normalization, or dataset provisioning."
    - "Live trading, broker integration, or any financial side effect."
    - "Independent certification of the research (owned by quant-validator)."
    - "Changing project objectives, critical invariants, or governance."

  prohibited_changes:
