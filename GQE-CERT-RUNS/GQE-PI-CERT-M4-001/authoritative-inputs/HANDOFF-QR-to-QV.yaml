derived_conclusions:
  - "ES_alpha does not factor through VaR_alpha: identical VaR, ES differing by a factor of 10 in the two-point counterexample."
  - "The ES curve and the VaR curve determine each other, so a 'VaR-only' competitor must declare a matched number of levels."
  - "ES_alpha = VaR_alpha + p^-1 E[(L - VaR_alpha)^+]; d_alpha - 1 is the relative mean exceedance beyond the VaR threshold."
  - "Under the loss RV/Acerbi-Tasche estimand, atoms at the VaR level make the conditional-expectation form wrong (0.516 vs 0.5102; single bond 0.8 vs 0.04)."
  - "VaR is not subadditive and ES is; a VaR-only ranking can penalize diversification (0.5 > 0 + 0)."
  - "ES requires a strictly stronger moment condition than VaR (finite first moment; tail index < 1 under regular variation)."
  - "The sqrt(h) horizon scaling is invalid under fat tails."
  - "At alpha=0.99 with n=10,000, SE(ln d) is about 7.9% for t_3 versus 2.4% for Gaussian-like tails; the minimum detectable ln d is about 22%, a 1.57x margin."
  - "Regime-conditional non-parametric ES at alpha=0.99 daily is not estimable with ~15 stress-day exceedances."
  - "The substantive question is whether d_alpha varies beyond what VaR plus a stable fat-tailed shape can capture, not whether ES differs from VaR analytically."

assumptions:
  - "A conditional loss distribution exists with a finite VaR quantile at the declared alpha."
  - "Alpha, h, decision rule and loss function are fixed before evaluation."
  - "All filters, thresholds and regime labels are point-in-time available."
  - "A genuine out-of-time holdout exists."
  - "A transaction-cost and turnover model is declared for decision-value comparison."
  - "Explicitly NOT assumed: normality; i.i.d. returns; stationarity; finite variance; finiteness of ES; elicitability of ES alone; a stable tail shape; that any particular alpha, h or estimator is correct; that any advantage persists; any dataset, strategy or market."

