task:

  requested_work: >
    Design a bounded quantitative research methodology determining whether Expected
    Shortfall / CVaR provides useful tail-risk information beyond VaR for a strategy with
    possibly fat-tailed and regime-dependent returns. Research methodology only.

  completed_work:
    - "VaR and Expected Shortfall defined on the loss distribution with an explicit sign convention (L = -r, loss-positive), units, confidence-level semantics (alpha as confidence level, p = 1-alpha) and horizon semantics (h in trading days, no sqrt(h) scaling)."
    - "Estimand fixed as the Acerbi-Tasche / Rockafellar-Uryasev integral form, with the atom case analysed and the conditional-expectation form shown to disagree."
    - "Tail-shape ratio d_alpha = ES_alpha / VaR_alpha introduced as the comparison statistic, with the fat-tailed location-scale null H0 (fixed standardized-residual shape) as the primary competitor."
    - "Three-level test sequence defined: Q0 informational non-redundancy, Q1 estimable incremental information, Q2 decision value."
    - "Fat-tail treatment without normality: GPD/POT, Student-t, empirical tails; ES existence precondition (tail index < 1) made an explicit tested precondition."
    - "Regime-dependent analysis design with point-in-time regime definitions and the location-scale invariance result."
    - "Estimation-error and power treatment: asymptotic variance/covariance of the VaR and ES estimators, bootstrap design, minimum detectable effect, minimum-data rule."
    - "Supporting evidence criteria S1-S8 and refuting/weakening evidence criteria R1-R10 defined, including an explicit absence-of-evidence rule."
    - "Worked analytical checks C1-C12 and numerical expectations E1-E8, including the two-bond atom example, the subadditivity example, and Student-t closed forms."
    - "Sixteen required tests T1-T16 for independent falsification."

  excluded_work:
    - "Production implementation, data pipeline, or code deliverable."
    - "Data ingestion or dataset provisioning."
    - "Empirical estimation against any dataset."
    - "Independent certification of the research."
    - "Live trading or any financial side effect."

