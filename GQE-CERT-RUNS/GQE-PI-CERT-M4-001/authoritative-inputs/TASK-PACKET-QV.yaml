objective:

  requested_outcome: >
    Independently validate the frozen Quant Researcher methodology artifact
    authoritative-inputs/qr-result.md by adversarially attempting to falsify its material
    quantitative claims. Recompute at least one material quantitative claim from scratch,
    in a way that does not reuse the candidate's own reasoning path. Return a property-level
    claim status list and a canonical terminal status.

  reason: >
    Canonical EFFECTIVE_CHALLENGE requires material conclusions to pass a separate role
    able to veto progression. The certification must show that Pi can run that role in a
    distinct context, on persisted authority, with executable recomputation.

  definition_of_completion:
    - "At least one material quantitative claim is independently recomputed with executed command evidence."
    - "Each tested claim has an explicit status: PASS | FAIL | INCONCLUSIVE | NOT_TESTED | BLOCKED."
    - "Counterexamples or falsifications are preserved, not smoothed."
    - "Untested areas are listed explicitly."
    - "A canonical terminal status is returned."
    - "Required human decisions and residual risks are listed."

  intended_downstream_consumer: "portfolio_manager (Human Gate)"

scope:

  in_scope:
    - "Adversarial inspection of authoritative-inputs/qr-result.md."
    - "Independent recomputation of mathematical and numerical claims using executable commands."
    - "Falsification attempts on the central methodological claims."
    - "Assessment of whether the stated evidence supports the claims actually made."
    - "Enforcement/invariant compliance checks within the validation scope."

  out_of_scope:
    - "Rewriting or repairing the candidate."
    - "Changing the research hypothesis or the specification."
    - "Producing any implementation."
    - "Approving production or any financial side effect."
    - "Empirical evaluation against data (no dataset exists)."
    - "Modifying any file in the workspace: return the result; the orchestrator persists it."

  prohibited_changes:
