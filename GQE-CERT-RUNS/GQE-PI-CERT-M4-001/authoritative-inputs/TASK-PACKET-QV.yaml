verification:

  required_checks:

    - id: "independent-recomputation"
      type: "command"
      expected_result: "at least one material quantitative claim recomputed with executed evidence"
      blocking: true

    - id: "T1-two-point-counterexample"
      type: "command"
      expected_result: "identical VaR (0), ES 1 vs 10"
      blocking: false

    - id: "T3-E1-table-recomputation"
      type: "command"
      expected_result: "d = 1.2541 (N, alpha=0.95), 1.1457 (N, 0.99), ~1.4343 (t5, 0.95), ~1.3226 (t5, 0.99), ~1.6462 (t3, 0.95), ~1.5419 (t3, 0.99)"
      blocking: false

    - id: "T2-integral-vs-closed-form"
      type: "command"
      expected_result: "agree to <= 1e-6"
      blocking: false

    - id: "T9-normality-audit"
      type: "static_analysis"
      expected_result: "no step assumes normally distributed returns; c(alpha) used only as a reporting reference"
      blocking: true

    - id: "T8-sqrt-h-prohibition"
      type: "command"
      expected_result: "no sqrt(h) scaling applied under fat tails"
      blocking: false

    - id: "T16-sanitary-oracles"
      type: "command"
      expected_result: "ES >= VaR, monotone in alpha, d = 1/(1-xi) under Pareto, scale invariance when mean is zero"
      blocking: false

  not_applicable_checks:
    - id: "empirical-evaluation"
      reason: "No dataset in scope; research methodology only."

  evidence_required: true

